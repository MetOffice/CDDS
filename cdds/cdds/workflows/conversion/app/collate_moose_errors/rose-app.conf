[command]
# Fail after collating so the upstream extract/transfer failure still stalls the workflow.
default=. $setup &&
       collate_moose_errors ${REQUEST_CONFIG_PATH} --stream ${STREAM} &&
       echo "Exiting non-zero on purpose so the workflow stalls." &&
       echo "This task only runs after run_extract or run_transfer has failed." &&
       echo "Fix the cause, then retrigger the failed task." &&
       false

[env]
setup=${SETUP_CMD}
