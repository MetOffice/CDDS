[command]
# Fail after collating so the upstream extract/transfer failure still stalls the workflow.
default=. $setup && collate_moose_errors ${REQUEST_CONFIG_PATH} --stream ${STREAM} && echo "${failure_msg}" && false

[env]
failure_msg=Exiting non-zero on purpose: this task only runs after run_extract or run_transfer has failed, so it fails to keep the workflow stalled for investigation. Fix the cause, then retrigger the failed task.
setup=${SETUP_CMD}
